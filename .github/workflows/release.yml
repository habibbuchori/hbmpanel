name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (static export)
        working-directory: frontend
        run: npm run build

      - name: Stage embed dist
        run: |
          rm -rf backend/internal/web/dist
          mkdir -p backend/internal/web/dist
          cp -r frontend/out/. backend/internal/web/dist/

      - name: Build Go binary (linux/${{ matrix.arch }})
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/habibbuchori/hbmpanel/internal/config.Version=${VERSION}" \
            -o ../dist/hbmpanel \
            ./cmd/hbmpanel
          ls -lh ../dist/

      - name: Package tarball
        run: |
          cd dist
          tar -czf hbmpanel-linux-${{ matrix.arch }}.tar.gz hbmpanel
          sha256sum hbmpanel-linux-${{ matrix.arch }}.tar.gz > hbmpanel-linux-${{ matrix.arch }}.tar.gz.sha256
          rm hbmpanel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hbmpanel-linux-${{ matrix.arch }}
          path: |
            dist/hbmpanel-linux-${{ matrix.arch }}.tar.gz
            dist/hbmpanel-linux-${{ matrix.arch }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show assets
        run: ls -lh dist/

      - name: Checkout (untuk akses installer)
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            installer/install.sh
