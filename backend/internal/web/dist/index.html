<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HBMPanel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; background:#0b0b0c; color:#eaeaea;
           display:flex; align-items:center; justify-content:center; height:100vh; margin:0 }
    .card { padding:32px 40px; border:1px solid #222; border-radius:8px; max-width:480px }
    h1 { margin:0 0 8px; font-size:24px }
    p  { color:#888; margin:0; line-height:1.6 }
    code { background:#1a1a1c; padding:2px 6px; border-radius:4px; font-size:13px }
  </style>
</head>
<body>
  <div class="card">
    <h1>HBMPanel</h1>
    <p>Backend running. Frontend belum di-build.</p>
    <p style="margin-top:12px">Jalankan <code>pnpm build</code> di <code>frontend/</code> lalu
       copy hasil <code>out/</code> ke <code>backend/internal/web/dist/</code>,
       atau jalankan <code>bash scripts/build.sh</code>.</p>
  </div>
</body>
</html>
